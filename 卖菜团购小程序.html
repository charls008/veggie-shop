<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新鲜蔬菜团购 - 产地直供</title>
<style>
/* ===== 基础重置 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: #f2f3f5;
  color: #333;
  font-size: 14px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
input, textarea { user-select: text; }
:root {
  --green: #00b565;
  --green-dark: #009550;
  --green-light: #e8f7ef;
  --orange: #ff7a45;
  --red: #e8483f;
  --gray: #999;
  --bg: #f2f3f5;
  --card: #ffffff;
  --radius: 10px;
}
img { display: block; max-width: 100%; }
button { border: none; outline: none; cursor: pointer; font-family: inherit; }

/* ===== APP 容器 ===== */
#app {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  position: relative;
  overflow-x: hidden;
  padding-bottom: 60px;
}

/* ===== 顶部Header ===== */
.app-header {
  background: linear-gradient(135deg, var(--green), var(--green-dark));
  color: #fff;
  padding: 12px 16px 14px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,181,101,.25);
}
.app-header .shop-name {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  font-weight: 700;
}
.app-header .shop-name .icon { font-size: 22px; }
.app-header .sub {
  font-size: 12px;
  opacity: .85;
  margin-top: 3px;
}
.app-header .notice {
  margin-top: 8px;
  background: rgba(255,255,255,.18);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.app-header .notice .tag {
  background: #fff;
  color: var(--green);
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 11px;
  flex-shrink: 0;
}
.app-header .notice .text {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* ===== 分类标签 ===== */
.category-bar {
  display: flex;
  overflow-x: auto;
  background: #fff;
  padding: 10px 8px;
  gap: 6px;
  position: sticky;
  top: 0;
  z-index: 90;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.category-bar::-webkit-scrollbar { display: none; }
.cat-item {
  flex-shrink: 0;
  padding: 5px 14px;
  border-radius: 16px;
  font-size: 13px;
  color: #555;
  background: var(--bg);
  transition: all .2s;
  font-weight: 500;
}
.cat-item.active {
  background: var(--green);
  color: #fff;
  font-weight: 700;
}

/* ===== 团购优惠条 ===== */
.promo-bar {
  background: linear-gradient(90deg, #fff5e8, #fff0e0);
  margin: 8px;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--orange);
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  border: 1px solid #ffe4cc;
}
.promo-bar .icon { font-size: 16px; }

/* ===== 商品列表 ===== */
.product-list {
  padding: 4px 8px 80px;
}
.product-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
.product-card {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
  position: relative;
  transition: transform .15s;
}
.product-card:active { transform: scale(.98); }
.product-card .img-wrap {
  width: 100%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
  background: var(--green-light);
  position: relative;
}
.product-card .tag-sale {
  position: absolute;
  top: 0;
  left: 0;
  background: var(--red);
  color: #fff;
  font-size: 10px;
  padding: 2px 6px;
  border-bottom-right-radius: 8px;
  font-weight: 700;
}
.product-card .tag-hot {
  position: absolute;
  top: 0;
  right: 0;
  background: var(--orange);
  color: #fff;
  font-size: 10px;
  padding: 2px 6px;
  border-bottom-left-radius: 8px;
  font-weight: 700;
}
.product-card .info {
  padding: 8px;
}
.product-card .name {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.product-card .desc {
  font-size: 11px;
  color: var(--gray);
  margin-bottom: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.product-card .price-row {
  display: flex;
  align-items: baseline;
  gap: 4px;
}
.product-card .price {
  font-size: 16px;
  font-weight: 800;
  color: var(--red);
}
.product-card .price .unit {
  font-size: 11px;
  font-weight: 500;
}
.product-card .old-price {
  font-size: 11px;
  color: var(--gray);
  text-decoration: line-through;
}
.product-card .stock {
  font-size: 10px;
  color: var(--gray);
  margin-left: auto;
}
.product-card .add-btn {
  position: absolute;
  bottom: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--green);
  color: #fff;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(0,181,101,.4);
  transition: all .15s;
}
.product-card .add-btn:active { transform: scale(.85); }
.product-card .add-btn.disabled {
  background: #ccc;
  box-shadow: none;
}

/* ===== 底部购物车浮动栏 ===== */
.cart-bar {
  position: fixed;
  bottom: 56px;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  background: #fff;
  box-shadow: 0 -2px 12px rgba(0,0,0,.1);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 80;
  transition: transform .3s;
}
.cart-bar.hidden { transform: translateX(-50%) translateY(100%); }
.cart-bar .cart-icon {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: var(--green);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  position: relative;
  flex-shrink: 0;
  margin-top: -18px;
  box-shadow: 0 2px 8px rgba(0,181,101,.35);
}
.cart-bar .cart-icon .badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: var(--red);
  color: #fff;
  font-size: 11px;
  min-width: 18px;
  height: 18px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  font-weight: 700;
  border: 2px solid #fff;
}
.cart-bar .cart-info {
  flex: 1;
}
.cart-bar .cart-total {
  font-size: 18px;
  font-weight: 800;
  color: #333;
}
.cart-bar .cart-total .symbol { font-size: 13px; }
.cart-bar .cart-hint {
  font-size: 11px;
  color: var(--gray);
}
.cart-bar .cart-hint .highlight { color: var(--orange); font-weight: 600; }
.cart-bar .checkout-btn {
  background: var(--green);
  color: #fff;
  padding: 10px 20px;
  border-radius: 22px;
  font-size: 15px;
  font-weight: 700;
  flex-shrink: 0;
}
.cart-bar .checkout-btn.disabled {
  background: #ccc;
}

/* ===== 底部导航 ===== */
.tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  background: #fff;
  display: flex;
  border-top: 1px solid #eee;
  z-index: 90;
  height: 56px;
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--gray);
  font-size: 11px;
  transition: color .2s;
}
.tab-item .icon { font-size: 22px; }
.tab-item.active { color: var(--green); font-weight: 600; }

/* ===== 页面容器 ===== */
.page { display: none; }
.page.active { display: block; }

/* ===== 购物车页面 ===== */
.cart-page { padding: 8px 8px 80px; }
.cart-page .section-title {
  font-size: 14px;
  font-weight: 700;
  padding: 8px 4px;
  color: #555;
}
.cart-item {
  background: #fff;
  border-radius: var(--radius);
  padding: 10px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.cart-item .ci-img {
  width: 56px;
  height: 56px;
  border-radius: 8px;
  background: var(--green-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  flex-shrink: 0;
}
.cart-item .ci-info { flex: 1; min-width: 0; }
.cart-item .ci-name { font-size: 14px; font-weight: 600; }
.cart-item .ci-desc { font-size: 11px; color: var(--gray); margin-top: 2px; }
.cart-item .ci-price { font-size: 15px; font-weight: 800; color: var(--red); margin-top: 3px; }
.cart-item .ci-price .unit { font-size: 11px; font-weight: 500; }
.cart-item .ci-ctrl {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.cart-item .ci-ctrl button {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}
.cart-item .ci-ctrl .minus {
  background: var(--bg);
  color: #666;
}
.cart-item .ci-ctrl .plus {
  background: var(--green);
  color: #fff;
}
.cart-item .ci-ctrl .qty {
  font-size: 15px;
  font-weight: 700;
  min-width: 22px;
  text-align: center;
}
.cart-empty {
  text-align: center;
  padding: 80px 20px;
  color: var(--gray);
}
.cart-empty .icon { font-size: 60px; margin-bottom: 12px; }
.cart-empty .text { font-size: 15px; margin-bottom: 16px; }
.cart-empty .go-btn {
  display: inline-block;
  background: var(--green);
  color: #fff;
  padding: 8px 24px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
}

/* 团购优惠明细 */
.promo-detail {
  background: #fff;
  border-radius: var(--radius);
  padding: 12px;
  margin: 8px 0;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.promo-detail .pd-title {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
  color: #555;
}
.promo-detail .pd-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  padding: 4px 0;
}
.promo-detail .pd-row .label { color: #666; }
.promo-detail .pd-row .val { font-weight: 600; }
.promo-detail .pd-row.discount .val { color: var(--red); }
.promo-detail .pd-row.total {
  border-top: 1px solid #eee;
  margin-top: 4px;
  padding-top: 8px;
  font-size: 16px;
  font-weight: 800;
}
.promo-detail .pd-row.total .val { color: var(--red); font-size: 18px; }
.promo-rules {
  background: #fff5e8;
  border-radius: 8px;
  padding: 8px 12px;
  margin: 8px 0;
  font-size: 12px;
  color: var(--orange);
  line-height: 1.8;
}
.promo-rules .title { font-weight: 700; margin-bottom: 4px; }

/* ===== 下单页面 ===== */
.order-page { padding: 8px 8px 80px; }
.order-section {
  background: #fff;
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 8px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.order-section .os-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid #f0f0f0;
}
.form-row {
  display: flex;
  align-items: center;
  padding: 8px 0;
  gap: 8px;
}
.form-row .label {
  width: 70px;
  font-size: 14px;
  color: #555;
  flex-shrink: 0;
}
.form-row input, .form-row textarea, .form-row select {
  flex: 1;
  border: 1px solid #e8e8e8;
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 14px;
  font-family: inherit;
  background: var(--bg);
  outline: none;
  transition: border-color .2s;
}
.form-row input:focus, .form-row textarea:focus, .form-row select:focus {
  border-color: var(--green);
  background: #fff;
}
.form-row textarea { resize: none; height: 60px; }
.form-row .required { color: var(--red); }

.order-product-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid #f5f5f5;
}
.order-product-item:last-child { border-bottom: none; }
.order-product-item .opi-img {
  width: 36px; height: 36px;
  border-radius: 6px;
  background: var(--green-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.order-product-item .opi-info { flex: 1; }
.order-product-item .opi-name { font-size: 13px; font-weight: 600; }
.order-product-item .opi-qty { font-size: 12px; color: var(--gray); }
.order-product-item .opi-price { font-size: 13px; font-weight: 700; color: var(--red); }

.time-slot {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.time-slot .slot {
  padding: 6px 12px;
  border: 1px solid #e8e8e8;
  border-radius: 6px;
  font-size: 12px;
  color: #555;
  background: var(--bg);
  transition: all .15s;
}
.time-slot .slot.active {
  border-color: var(--green);
  background: var(--green-light);
  color: var(--green);
  font-weight: 700;
}

.submit-order-btn {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  background: var(--green);
  color: #fff;
  padding: 14px;
  text-align: center;
  font-size: 16px;
  font-weight: 700;
  z-index: 85;
}

/* ===== 订单列表页 ===== */
.order-list-page { padding: 8px 8px 80px; }
.order-card {
  background: #fff;
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 8px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.order-card .oc-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid #f0f0f0;
}
.order-card .oc-no { font-size: 12px; color: var(--gray); }
.order-card .oc-status {
  font-size: 12px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
}
.order-card .oc-status.pending { background: #fff5e8; color: var(--orange); }
.order-card .oc-status.delivering { background: #e8f0ff; color: #3380ff; }
.order-card .oc-status.delivered { background: var(--green-light); color: var(--green); }
.order-card .oc-products {
  margin-bottom: 8px;
}
.order-card .oc-product-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  padding: 3px 0;
  color: #666;
}
.order-card .oc-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 8px;
  border-top: 1px solid #f5f5f5;
}
.order-card .oc-time { font-size: 11px; color: var(--gray); }
.order-card .oc-total { font-size: 16px; font-weight: 800; color: var(--red); }
.order-card .oc-total .label { font-size: 12px; font-weight: 500; color: #666; }

/* ===== 我的页面 ===== */
.profile-page { padding-bottom: 80px; }
.profile-header {
  background: linear-gradient(135deg, var(--green), var(--green-dark));
  color: #fff;
  padding: 24px 16px;
  text-align: center;
}
.profile-header .avatar {
  width: 60px; height: 60px;
  border-radius: 50%;
  background: rgba(255,255,255,.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
  margin: 0 auto 8px;
}
.profile-header .name { font-size: 17px; font-weight: 700; }
.profile-header .phone { font-size: 13px; opacity: .85; margin-top: 2px; }
.profile-menu {
  background: #fff;
  margin: 8px;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.profile-menu .pm-item {
  display: flex;
  align-items: center;
  padding: 14px 12px;
  border-bottom: 1px solid #f5f5f5;
  gap: 10px;
}
.profile-menu .pm-item:last-child { border-bottom: none; }
.profile-menu .pm-item .icon { font-size: 20px; }
.profile-menu .pm-item .text { flex: 1; font-size: 14px; }
.profile-menu .pm-item .arrow { font-size: 14px; color: #ccc; }
.profile-stats {
  display: flex;
  margin: 8px;
  background: #fff;
  border-radius: var(--radius);
  padding: 14px 0;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.profile-stats .ps-item {
  flex: 1;
  text-align: center;
  border-right: 1px solid #f0f0f0;
}
.profile-stats .ps-item:last-child { border-right: none; }
.profile-stats .ps-num { font-size: 20px; font-weight: 800; color: var(--green); }
.profile-stats .ps-label { font-size: 12px; color: var(--gray); margin-top: 2px; }

/* ===== 弹窗 ===== */
.mask {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,.45);
  z-index: 200;
  display: none;
}
.mask.show { display: block; }
.popup {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) translateY(100%);
  width: 100%;
  max-width: 430px;
  background: #fff;
  border-radius: 16px 16px 0 0;
  z-index: 201;
  transition: transform .3s;
  max-height: 80vh;
  overflow-y: auto;
}
.popup.show { transform: translateX(-50%) translateY(0); }
.popup .pp-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid #f0f0f0;
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 10;
}
.popup .pp-header .title { font-size: 16px; font-weight: 700; }
.popup .pp-header .close { font-size: 22px; color: var(--gray); }
.popup .pp-body { padding: 12px 16px 20px; }

/* 订单成功弹窗 */
.success-popup {
  text-align: center;
  padding: 30px 20px;
}
.success-popup .icon {
  font-size: 56px;
  margin-bottom: 12px;
}
.success-popup .title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.success-popup .desc { font-size: 14px; color: var(--gray); margin-bottom: 20px; }
.success-popup .order-info {
  background: var(--bg);
  border-radius: 8px;
  padding: 12px;
  text-align: left;
  margin-bottom: 16px;
  font-size: 13px;
  line-height: 2;
}
.success-popup .order-info .label { color: var(--gray); }
.success-popup .order-info .val { font-weight: 600; }
.success-popup .btn-row {
  display: flex;
  gap: 10px;
}
.success-popup .btn-row button {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
}
.success-popup .btn-row .btn-sec {
  background: var(--bg);
  color: #555;
}
.success-popup .btn-row .btn-pri {
  background: var(--green);
  color: #fff;
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,.75);
  color: #fff;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 999;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

/* 添加购物车飞入动画 */
@keyframes flyToCart {
  0% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(.3) translateY(-100px); }
}
.fly-emoji {
  position: fixed;
  z-index: 999;
  font-size: 30px;
  pointer-events: none;
  animation: flyToCart .6s ease-out forwards;
}

/* ===== 商家后台 ===== */
.admin-header {
  background: linear-gradient(135deg, #243447, #2f415a);
  color: #fff;

/* 简易哈希，防止直接明文看到密码，非加密级别但足够防普通顾客 */
function pwdHash(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
  return 'p' + Math.abs(h);
}

/* 入口：点"商家后台"时调用 */
function enterAdmin() {
  if (state.adminUnlocked) {
    switchPage('admin');
    return;
  }
  var saved = loadAdminPwd();
  if (!saved) {
    // 首次使用，设置密码
    showPwdDialog('set');
  } else {
    // 验证密码
    showPwdDialog('verify');
  }
}

function showPwdDialog(mode) {
  var popup = document.getElementById('popup');
  var isSet = mode === 'set';
  var isChange = mode === 'change';
  var isChangeNew = mode === 'changeNew';
  var title = isSet ? '设置商家密码' : isChange ? '修改商家密码' : isChangeNew ? '设置新密码' : '输入商家密码';
  var desc = isSet ? '首次使用请设置一个密码，保护后台管理' : isChange ? '请输入当前密码验证身份' : isChangeNew ? '请输入新的密码' : '请输入密码进入商家后台';
  var placeholder = (isSet || isChangeNew) ? '设置4-12位密码' : '请输入密码';
  var btnText = isSet ? '确认设置' : isChangeNew ? '保存新密码' : '确认';
  var showConfirm = isSet || isChangeNew;

  var html = '<div class="pp-header"><span class="title">🔒 ' + title + '</span><span class="close" onclick="closePopup()">×</span></div>' +
    '<div class="pp-body"><div class="lock-screen" style="padding:10px 0 0;">' +
      '<div class="lock-icon">🔒</div>' +
      '<div class="lock-title">' + title + '</div>' +
      '<div class="lock-desc">' + desc + '</div>' +
      '<input class="pwd-input" id="pwd-input" type="password" placeholder="' + placeholder + '" maxlength="12" autocomplete="off">' +
      (showConfirm ? '<input class="pwd-input" id="pwd-input2" type="password" placeholder="再输入一次确认" maxlength="12" autocomplete="off" style="margin-top:8px;">' : '') +
      '<div class="pwd-hint" id="pwd-hint"></div>' +
      '<button class="pwd-btn" id="pwd-confirm-btn" onclick="confirmPwd(\'' + mode + '\')">' + btnText + '</button>' +
      (isSet ? '<button class="pwd-btn sec" onclick="closePopup()">暂不设置</button>' : '') +
    '</div></div>';

  popup.innerHTML = html;
  document.getElementById('mask').classList.add('show');
  popup.classList.add('show');
  // 聚焦输入框，回车确认
  setTimeout(function() {
    var inp = document.getElementById('pwd-input');
    if (inp) { inp.focus(); inp.addEventListener('keydown', function(e){ if(e.key==='Enter') confirmPwd(mode); }); }
  }, 100);
}

function confirmPwd(mode) {
  var input = document.getElementById('pwd-input').value.trim();
  var hintEl = document.getElementById('pwd-hint');
  var input2 = document.getElementById('pwd-input2');
  var input2Val = input2 ? input2.value.trim() : '';

  if (mode === 'set') {
    // 首次设置密码
    if (input.length < 4) { hintEl.innerHTML = '<span class="err">密码至少4位</span>'; return; }
    if (input !== input2Val) { hintEl.innerHTML = '<span class="err">两次输入不一致</span>'; return; }
    saveAdminPwd(pwdHash(input));
    state.adminUnlocked = true;
    closePopup();
    showToast('密码已设置，后台已保护');
    switchPage('admin');
    return;
  }

  if (mode === 'verify') {
    // 验证密码
    var saved = loadAdminPwd();
    if (pwdHash(input) === saved) {
      state.adminUnlocked = true;
      closePopup();
      showToast('已解锁');
      switchPage('admin');
    } else {
      hintEl.innerHTML = '<span class="err">密码错误，请重试</span>';
      document.getElementById('pwd-input').value = '';
      document.getElementById('pwd-input').focus();
    }
    return;
  }

  if (mode === 'change') {
    // 修改密码第一步：验证旧密码
    var saved = loadAdminPwd();
    if (pwdHash(input) !== saved) {
      hintEl.innerHTML = '<span class="err">当前密码错误</span>';
      document.getElementById('pwd-input').value = '';
      return;
    }
    hintEl.innerHTML = '';
    // 进入第二步：设置新密码
    showPwdDialog('changeNew');
    return;
  }

  if (mode === 'changeNew') {
    // 修改密码第二步：设置新密码
    if (input.length < 4) { hintEl.innerHTML = '<span class="err">新密码至少4位</span>'; return; }
    if (input !== input2Val) { hintEl.innerHTML = '<span class="err">两次输入不一致</span>'; return; }
    saveAdminPwd(pwdHash(input));
    closePopup();
    showToast('密码已修改');
    return;
  }
}

/* 锁定后台 */
function lockAdmin() {

  showToast('后台已锁定');
  switchPage('home');
}

/* 页面切换时拦截：如果切到admin但未解锁，弹密码框 */
function switchPage(name) {
  // 拦截：进入后台必须先解锁
  if (name === 'admin' && !state.adminUnlocked) {
    enterAdmin();
    return;
  }
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page-' + name).classList.add('active');

  document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
  var tab = document.querySelector('[data-page="' + name + '"]');
  if (tab) tab.classList.add('active');

  // 页面滚动到顶
  window.scrollTo(0, 0);

  // 按页面渲染内容
  if (name === 'cart') renderCart();
  if (name === 'orders') renderOrders();
  if (name === 'profile') renderProfile();
  if (name === 'order') renderOrderPage();
  if (name === 'admin') renderAdmin();

  // 控制购物车浮动栏 & 提交按钮 & 底部导航显示
  var cartBar = document.getElementById('cart-bar');
  var submitBtn = document.getElementById('submit-order-btn');
  var tabbar = document.querySelector('.tabbar');
  if (name === 'home') {
    cartBar.classList.remove('hidden');
    updateCartBar();
  } else if (name === 'cart') {
    cartBar.classList.remove('hidden');
    updateCartBar();
  } else {
    cartBar.classList.add('hidden');
  }
  // 下单页面/后台页面隐藏底部导航栏，避免遮挡
  if (name === 'order') {
    submitBtn.style.display = 'block';
    tabbar.style.display = 'none';
  } else if (name === 'admin') {
    submitBtn.style.display = 'none';
    tabbar.style.display = 'none';
  } else {
    submitBtn.style.display = 'none';
    tabbar.style.display = 'flex';
  }
}

/* ========================================
   购物车操作
   ======================================== */
function addToCart(productId, event) {
  var product = getProductById(productId);
  if (!product) return;
  if (product.onSale === false) { showToast('该商品已下架'); return; }
  if (product.stock <= 0) { showToast('该商品已售罄'); return; }

  var existing = state.cart.find(function(item) { return item.id === productId; });
  if (existing) {
    existing.qty++;
  } else {
    state.cart.push({ id: productId, qty: 1 });
  }
  saveCart();
  updateCartBar();
  showToast('已加入购物车: ' + product.name);

  // 飞入动画
  if (event) {
    var fly = document.createElement('div');
    fly.className = 'fly-emoji';
    fly.textContent = product.emoji;
    fly.style.left = (event.clientX - 15) + 'px';
    fly.style.top = (event.clientY - 15) + 'px';
    document.body.appendChild(fly);
    setTimeout(function() { fly.remove(); }, 600);
  }
}

function changeQty(productId, delta) {
  var item = state.cart.find(function(i) { return i.id === productId; });
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) {
    state.cart = state.cart.filter(function(i) { return i.id !== productId; });
  }
  saveCart();
  renderCart();
  updateCartBar();
}

function removeFromCart(productId) {
  state.cart = state.cart.filter(function(i) { return i.id !== productId; });
  saveCart();
  renderCart();
  updateCartBar();
}

function clearCart() {
  state.cart = [];
  saveCart();
}

/* 计算购物车汇总 */
function calcCartTotal() {
  var subtotal = 0;
  var items = state.cart.map(function(ci) {
    var p = getProductById(ci.id);
    if (!p) return null;
    var itemTotal = p.price * ci.qty;
    subtotal += itemTotal;
    return { product: p, qty: ci.qty, itemTotal: itemTotal };
  }).filter(function(x) { return x !== null; });

  // 团购折扣
  var discountRate = 1;
  var discountName = '';
  if (subtotal >= state.promo.discount80) {
    discountRate = 0.8;
    discountName = '满' + state.promo.discount80 + '打8折';
  } else if (subtotal >= state.promo.discount90) {
    discountRate = 0.9;
    discountName = '满' + state.promo.discount90 + '打9折';
  }
  var discountAmount = subtotal * (1 - discountRate);
  var afterDiscount = subtotal - discountAmount;

  // 配送费
  var shippingFee = subtotal >= state.promo.freeShippingThreshold ? 0 : state.promo.shippingFee;

  // 新客减免
  var newCustomerDiscount = state.isFirstOrder ? state.promo.newCustomerDiscount : 0;

  var total = afterDiscount + shippingFee - newCustomerDiscount;
  if (total < 0) total = 0;

  return {
    items: items,
    subtotal: subtotal,
    discountRate: discountRate,
    discountName: discountName,
    discountAmount: discountAmount,
    afterDiscount: afterDiscount,
    shippingFee: shippingFee,
    newCustomerDiscount: newCustomerDiscount,
    total: total,
    count: state.cart.reduce(function(s, i) { return s + i.qty; }, 0),
  };
}

/* 更新底部购物车栏 */
function updateCartBar() {
  var bar = document.getElementById('cart-bar');
  var badge = document.getElementById('cart-badge');
  var totalEl = document.getElementById('cart-bar-total');
  var hintEl = document.getElementById('cart-bar-hint');

  var summary = calcCartTotal();
  if (summary.count === 0) {
    bar.classList.add('hidden');
    return;
  }
  bar.classList.remove('hidden');
  badge.textContent = summary.count;
  totalEl.textContent = summary.total.toFixed(2);

  // 提示
  if (summary.subtotal < state.promo.freeShippingThreshold) {
    var diff = (state.promo.freeShippingThreshold - summary.subtotal).toFixed(1);
    hintEl.innerHTML = '还差 <span class="highlight">¥' + diff + '</span> 免配送费';
  } else if (summary.subtotal < state.promo.discount90) {
    var diff2 = (state.promo.discount90 - summary.subtotal).toFixed(1);
    hintEl.innerHTML = '已免配送费！再买 <span class="highlight">¥' + diff2 + '</span> 享9折';
  } else if (summary.subtotal < state.promo.discount80) {
    var diff3 = (state.promo.discount80 - summary.subtotal).toFixed(1);
    hintEl.innerHTML = '已享9折！再买 <span class="highlight">¥' + diff3 + '</span> 享8折';
  } else {
    hintEl.innerHTML = '已享<span class="highlight">8折</span>！多买多省 🎉';
  }
}

function submitOrder() {

  var phone = document.getElementById('f-phone').value.trim();
  var address = document.getElementById('f-address').value.trim();
  var remark = (document.getElementById('f-remark') || {}).value ? document.getElementById('f-remark').value.trim() : '';

  if (!name) { showToast('请填写收货人姓名'); return; }
  if (!phone || !/^1\d{10}$/.test(phone)) { showToast('请填写正确的手机号'); return; }
  if (!address) { showToast('请填写配送地址'); return; }
  if (state.selectedSlot === null) { showToast('请选择配送时间'); return; }

  var summary = calcCartTotal();

  var order = {
    id: 'ORD' + Date.now(),
    ts: Date.now(),
    no: 'No.' + new Date().toISOString().slice(0,10).replace(/-/g,'') + Math.floor(Math.random()*1000),
    items: summary.items.map(function(item) {
      return { name: item.product.name, emoji: item.product.emoji, qty: item.qty, unit: item.product.unit, price: item.product.price, total: item.itemTotal };
    }),
    name: name,
    phone: phone,
    address: address,
    slot: TIME_SLOTS[state.selectedSlot],
    remark: remark,
    subtotal: summary.subtotal,
    discountName: summary.discountName,
    discountAmount: summary.discountAmount,
    shippingFee: summary.shippingFee,
    newCustomerDiscount: summary.newCustomerDiscount,
    total: summary.total,
    status: 'pending',
    createTime: new Date().toLocaleString('zh-CN'),
  };

  state.orders.unshift(order);
  saveOrders();

  // 扣减商品库存
  summary.items.forEach(function(item) {
    var p = getProductById(item.product.id);
    if (p) { p.stock = Math.max(0, p.stock - item.qty); }
  });
  saveProducts();

  // 保存用户信息
  state.userInfo = { name: name, phone: phone, address: address };
  saveUserInfo();

  // 清空购物车
  clearCart();
  state.isFirstOrder = false;
  localStorage.setItem('veggie_first_order', '0');

  // 显示成功弹窗
  showOrderSuccess(order);
}

function renderOrders() {

  if (state.orders.length === 0) {

      '<div class="icon">📦</div>' +

    'delivering': { text: '配送中', cls: 'delivering' },
    'delivered': { text: '已送达', cls: 'delivered' },
  };

  container.innerHTML = state.orders.map(function(order) {

      return '<div class="oc-product-row">' +

        '<span>¥' + item.total.toFixed(2) + '</span>' +

    var discountHtml = '';
    if (order.discountAmount > 0) discountHtml += ' ' + order.discountName;
    if (order.newCustomerDiscount > 0) discountHtml += ' 新客立减';
    if (order.shippingFee === 0) discountHtml += ' 免配送费';

    return '<div class="order-card">' +
      '<div class="oc-header">' +
        '<span class="oc-no">' + order.no + '</span>' +
        '<span class="oc-status ' + st.cls + '">' + st.text + '</span>' +
      '</div>' +
      '<div class="oc-products">' + productsHtml + '</div>' +
      '<div style="font-size:12px;color:#999;margin-bottom:4px;">' +

        '🕐 ' + order.slot + discountHtml +

        '<span class="oc-time">' + order.createTime + '</span>' +
        '<span class="oc-total"><span class="label">实付 </span>¥' + order.total.toFixed(2) + '</span>' +
      '</div>' +

  }).join('');
}

  var deliveringCount = state.orders.filter(function(o) { return o.status === 'delivering'; }).length;

  var soldOutList = state.products.filter(function(p) { return p.onSale !== false && p.stock <= 0; });

  if (deliveringCount > 0) alerts += '<p>🚚 有 <b>' + deliveringCount + '</b> 笔订单配送中</p>';
  if (soldOutList.length > 0) alerts += '<p>❌ <b>' + soldOutList.length + '</b> 种商品已售罄：' + soldOutList.slice(0,4).map(function(p){return p.name;}).join('、') + '</p>';
  if (lowStock.length > 0) alerts += '<p>⚠️ <b>' + lowStock.length + '</b> 种商品库存不足10份：' + lowStock.slice(0,4).map(function(p){return p.name+'(剩'+p.stock+')';}).join('、') + '</p>';
  html += '<div class="admin-section"><div class="as-title">📌 今日待办</div>' +
    (alerts ? '<div style="font-size:13px;line-height:2.2;color:#555;">' + alerts + '</div>' : '<div class="admin-empty" style="padding:20px;">暂无待办，生意兴隆 🎉</div>') +
  '</div>';

  html += '<div class="admin-section"><div class="as-title">🕒 最近订单</div>';
  if (state.orders.length === 0) {
    html += '<div class="admin-empty">暂无订单</div>';
  } else {
    var statusMap = { pending: {t:'待配送',c:'var(--orange)'}, delivering: {t:'配送中',c:'#3380ff'}, delivered: {t:'已送达',c:'var(--green)'} };
    html += state.orders.slice(0, 6).map(function(o) {
      var st = statusMap[o.status] || statusMap.pending;
      return '<div class="admin-list-item">' +
        '<div class="ali-img" style="font-size:18px;">📋</div>' +
        '<div class="ali-info">' +
          '<div class="ali-name">' + o.no + ' <span style="font-size:11px;color:' + st.c + ';font-weight:700;">' + st.t + '</span></div>' +
          '<div class="ali-meta">' + o.name + ' · ' + o.items.length + '件 · <span class="price">¥' + o.total.toFixed(2) + '</span> · ' + (o.createTime || '') + '</div>' +
        '</div>' +
        '<div class="ali-btns"><button class="btn-sm edit" onclick="switchAdminTab(\'orders\')">处理</button></div>' +
      '</div>';
    }).join('');
  }
  html += '</div>';

  // 销量统计
  var salesMap = {};
  state.orders.forEach(function(o) {
    o.items.forEach(function(i) {
      if (!salesMap[i.name]) salesMap[i.name] = { name: i.name, emoji: i.emoji, qty: 0, revenue: 0 };
      salesMap[i.name].qty += i.qty;
      salesMap[i.name].revenue += i.total;
    });

  var topProducts = Object.values(salesMap).sort(function(a,b) { return b.qty - a.qty; }).slice(0, 5);

    html += '<div class="admin-empty">暂无销售数据</div>';

  container.innerHTML = html;

function showCategoryEditor(idx) {
  var c = (idx !== null && idx !== undefined) ? state.categories[idx] : null;
  state.editingCatIdx = idx;
  var emoji = c ? (c.emoji || '📂') : '📂';
  state.editingCatEmoji = emoji;

  var emojiHtml = CAT_EMOJI_LIST.map(function(e) {
    return '<span class="ep-item ' + (e === emoji ? 'active' : '') + '" onclick="selectCatEmoji(this, \'' + e + '\')">' + e + '</span>';
  }).join('');

  var nameVal = c ? c.name.replace(/^[^\s]+\s/, '') : '';
  var esc = function(s) { return String(s == null ? '' : s).replace(/"/g, '&quot;'); };
  var popup = document.getElementById('popup');
  popup.innerHTML = '<div class="pp-header"><span class="title">' + (c ? '编辑分类' : '添加新分类') + '</span><span class="close" onclick="closePopup()">×</span></div>' +
    '<div class="pp-body">' +
    '<div class="form-row" style="align-items:flex-start;"><span class="label" style="padding-top:6px;">图标</span><div class="emoji-picker" id="cat-emoji-picker" style="flex:1;">' + emojiHtml + '</div></div>' +
    '<div class="form-row"><span class="label">名称</span><input id="ce-name" type="text" value="' + esc(nameVal) + '" placeholder="如：肉类、咸菜" maxlength="8"></div>' +
    '<button class="save-btn" onclick="saveCategory()">保存分类</button>' +
    '</div>';
  document.getElementById('mask').classList.add('show');
  popup.classList.add('show');
}

function selectCatEmoji(el, e) {
  state.editingCatEmoji = e;
  document.querySelectorAll('#cat-emoji-picker .ep-item').forEach(function(item) { item.classList.remove('active'); });
  el.classList.add('active');
}

function saveCategory() {
  var name = document.getElementById('ce-name').value.trim();
  if (!name) { showToast('请输入分类名称'); return; }
  var fullName = state.editingCatEmoji + ' ' + name;
  if (state.editingCatIdx !== null && state.editingCatIdx !== undefined) {
    state.categories[state.editingCatIdx].name = fullName;
    state.categories[state.editingCatIdx].emoji = state.editingCatEmoji;
  } else {
    var key = 'cat_' + Date.now();
    state.categories.push({ key: key, name: fullName, emoji: state.editingCatEmoji });
  }
  saveCategories();
  closePopup();
  showToast('分类已保存');
  renderAdminCategories();
  renderCategories();
}

function moveCategory(idx, dir) {
  var newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= state.categories.length) return;
  var tmp = state.categories[idx];
  state.categories[idx] = state.categories[newIdx];
  state.categories[newIdx] = tmp;
  saveCategories();
  renderAdminCategories();
  renderCategories();
}

function deleteCategory(idx) {
  var c = state.categories[idx];
  if (!c) return;
  var count = state.products.filter(function(p) { return p.cat === c.key; }).length;
  var msg = count > 0 ? '分类「' + c.name + '」下有 ' + count + ' 种商品，删除后商品将归入"其他"。确定删除？' : '确定删除分类「' + c.name + '」吗？';
  if (!confirm(msg)) return;
  state.categories.splice(idx, 1);
  saveCategories();
  showToast('分类已删除');
  renderAdminCategories();
  renderCategories();
}

      '<button class="btn-sm ' + (p.onSale === false ? 'success' : 'gray') + '" onclick="toggleProductStatus(' + p.id + ')">' + (p.onSale === false ? '上架' : '下架') + '</button>' +
      '<button class="btn-sm danger" onclick="deleteProduct(' + p.id + ')">删除</button>' +
    '</div>' +
  '</div>';
}

function renderAdminProducts() {
  var container = document.getElementById('admin-content');
  var html = '<button class="add-product-btn" onclick="showProductEditor(null)">＋ 添加新商品</button>';
  var cats = getCustomCategories();
  cats.forEach(function(c) {
    var items = state.products.filter(function(p) { return p.cat === c.key; });
    if (items.length === 0) return;
    html += '<div class="admin-section"><div class="as-title">' + c.name + '（' + items.length + '种）</div>';
    html += items.map(adminProductRowHtml).join('');
    html += '</div>';
  });
  var usedKeys = cats.map(function(c){return c.key;});
  var etc = state.products.filter(function(p) { return usedKeys.indexOf(p.cat) < 0; });
  if (etc.length > 0) {
    html += '<div class="admin-section"><div class="as-title">其他（' + etc.length + '种，分类已删除）</div>' + etc.map(adminProductRowHtml).join('') + '</div>';
  }
  html += '<button class="save-btn" style="background:#f0f0f0;color:#666;margin-top:14px;" onclick="resetProducts()">↩ 恢复默认商品列表</button>';
  container.innerHTML = html;
}

function showProductEditor(id) {
  var p = id ? getProductById(id) : null;
  state.editingProductId = id;
  var emoji = p ? p.emoji : '🥬';
  state.editingEmoji = emoji;

  var catOptions = getCustomCategories().map(function(c) {
    var displayName = c.name.replace(/^[^\s]+\s*/, '');
    return '<option value="' + c.key + '"' + (p && p.cat === c.key ? ' selected' : '') + '>' + displayName + '</option>';
  }).join('');

  var emojiHtml = EMOJI_LIST.map(function(e) {
    return '<span class="ep-item ' + (e === emoji ? 'active' : '') + '" onclick="selectEmoji(this, \'' + e + '\')">' + e + '</span>';
  }).join('');

  var esc = function(s) { return String(s == null ? '' : s).replace(/"/g, '&quot;'); };
  var popup = document.getElementById('popup');
  popup.innerHTML = '<div class="pp-header"><span class="title">' + (p ? '编辑商品' : '添加新商品') + '</span><span class="close" onclick="closePopup()">×</span></div>' +
    '<div class="pp-body">' +
    '<div class="form-row" style="align-items:flex-start;"><span class="label" style="padding-top:6px;">图片</span><div class="emoji-picker" id="emoji-picker" style="flex:1;">' + emojiHtml + '</div></div>' +
    '<div class="form-row"><span class="label">名称</span><input id="pe-name" type="text" value="' + esc(p ? p.name : '') + '" placeholder="如：上海青" maxlength="10"></div>' +
    '<div class="form-row"><span class="label">分类</span><select id="pe-cat" style="flex:1;border:1px solid #e8e8e8;border-radius:6px;padding:8px 10px;font-size:14px;background:var(--bg);outline:none;">' + catOptions + '</select></div>' +
    '<div class="form-row"><span class="label">单位</span><input id="pe-unit" type="text" value="' + esc(p ? p.unit : '斤') + '" placeholder="斤/把/颗" maxlength="4"></div>' +
    '<div class="form-row"><span class="label">团购价</span><input id="pe-price" type="number" step="0.1" min="0" value="' + (p ? p.price : '') + '" placeholder="0.0"></div>' +
    '<div class="form-row"><span class="label">原价</span><input id="pe-oldprice" type="number" step="0.1" min="0" value="' + (p ? p.oldPrice : '') + '" placeholder="划线价（≥团购价）"></div>' +
    '<div class="form-row"><span class="label">库存</span><input id="pe-stock" type="number" min="0" step="1" value="' + (p ? p.stock : 50) + '"></div>' +
    '<div class="form-row"><span class="label">描述</span><input id="pe-desc" type="text" value="' + esc(p ? p.desc : '') + '" placeholder="一句话卖点" maxlength="14"></div>' +
    '<div class="switch-row"><span class="label">🔥 特价商品（进入特价区）</span><label class="toggle"><input type="checkbox" id="pe-sale"' + (p && p.isSale ? ' checked' : '') + '><span class="slider"></span></label></div>' +
    '<div class="switch-row"><span class="label">⭐ 热销标签</span><label class="toggle"><input type="checkbox" id="pe-hot"' + (p && p.isHot ? ' checked' : '') + '><span class="slider"></span></label></div>' +
    '<div class="switch-row"><span class="label">✅ 在售（顾客可见）</span><label class="toggle"><input type="checkbox" id="pe-onsale"' + (!p || p.onSale !== false ? ' checked' : '') + '><span class="slider"></span></label></div>' +
    '<button class="save-btn" onclick="saveProduct()">保存商品</button>' +
    '</div>';

function selectEmoji(el, e) {
  state.editingEmoji = e;
  document.querySelectorAll('#emoji-picker .ep-item').forEach(function(item) { item.classList.remove('active'); });
  el.classList.add('active');
}

function saveProduct() {
  var name = document.getElementById('pe-name').value.trim();
  var cat = document.getElementById('pe-cat').value;
  var unit = document.getElementById('pe-unit').value.trim() || '斤';
  var price = parseFloat(document.getElementById('pe-price').value);
  var oldPrice = parseFloat(document.getElementById('pe-oldprice').value);
  var stock = parseInt(document.getElementById('pe-stock').value);
  var desc = document.getElementById('pe-desc').value.trim() || '新鲜直达 品质保证';
  var isSale = document.getElementById('pe-sale').checked;
  var isHot = document.getElementById('pe-hot').checked;
  var onSale = document.getElementById('pe-onsale').checked;

  if (!name) { showToast('请输入商品名称'); return; }
  if (isNaN(price) || price <= 0) { showToast('请输入正确的团购价'); return; }
  if (isNaN(oldPrice) || oldPrice < price) oldPrice = price;
  if (isNaN(stock) || stock < 0) stock = 0;

  if (state.editingProductId) {
    var p = getProductById(state.editingProductId);
    if (p) {
      p.name = name; p.cat = cat; p.unit = unit; p.price = price; p.oldPrice = oldPrice;
      p.stock = stock; p.desc = desc; p.isSale = isSale; p.isHot = isHot;
      p.onSale = onSale; p.emoji = state.editingEmoji;
    }
  } else {
    var maxId = 0;
    state.products.forEach(function(x) { if (x.id > maxId) maxId = x.id; });
    state.products.push({
      id: maxId + 1, cat: cat, name: name, desc: desc, emoji: state.editingEmoji,
      price: price, oldPrice: oldPrice, unit: unit, stock: stock,
      isSale: isSale, isHot: isHot, onSale: onSale,
    });
  }
  saveProducts();
  closePopup();
  showToast('保存成功');
  renderAdminProducts();
  renderProducts();
}

function deleteProduct(id) {
  var p = getProductById(id);
  if (!p) return;
  if (!confirm('确定删除「' + p.name + '」吗？此操作不可撤销。')) return;
  state.products = state.products.filter(function(x) { return x.id !== id; });
  state.cart = state.cart.filter(function(x) { return x.id !== id; });
  saveCart();
  saveProducts();
  showToast('已删除');
  renderAdminProducts();
  renderProducts();
  updateCartBar();
}

function toggleProductStatus(id) {
  var p = getProductById(id);
  if (!p) return;
  p.onSale = p.onSale === false;
  saveProducts();
  showToast(p.onSale ? '已上架' : '已下架');
  renderAdminProducts();
  renderProducts();
}

function resetProducts() {
  if (!confirm('确定恢复默认商品列表吗？将覆盖当前所有商品设置。')) return;
  state.products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
  saveProducts();
  showToast('已恢复默认商品');
  renderAdminProducts();
  renderProducts();
}

/* --- 订单处理 --- */
function adminOrderCardHtml(o) {
  var statusMap = { pending: {t:'待配送',c:'var(--orange)'}, delivering: {t:'配送中',c:'#3380ff'}, delivered: {t:'已送达',c:'var(--green)'} };
  var st = statusMap[o.status] || statusMap.pending;
  var productsHtml = o.items.map(function(i) { return i.emoji + ' ' + i.name + '×' + i.qty + i.unit; }).join('　');
  var actionBtn = '';
  if (o.status === 'pending') actionBtn = '<button class="btn-sm success" onclick="advanceOrderStatus(\'' + o.id + '\')">开始配送</button>';
  else if (o.status === 'delivering') actionBtn = '<button class="btn-sm success" onclick="advanceOrderStatus(\'' + o.id + '\')">确认送达</button>';

  return '<div class="admin-section">' +
    '<div class="as-title" style="margin-bottom:6px;"><span>' + o.no + '</span><span style="font-size:12px;color:' + st.c + ';font-weight:700;">' + st.t + '</span></div>' +
    '<div style="font-size:13px;color:#555;line-height:1.8;">' + productsHtml + '</div>' +
    '<div style="font-size:12px;color:#999;margin:6px 0;">👤 ' + o.name + ' ' + o.phone + '<br>📍 ' + o.address + '<br>🕐 ' + o.slot + (o.remark ? '<br>💬 ' + o.remark : '') + '</div>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;">' +
      '<span style="font-size:16px;font-weight:800;color:var(--red);">¥' + o.total.toFixed(2) + '</span>' +
      '<div class="ali-btns">' + actionBtn + '<button class="btn-sm edit" onclick="showAdminOrderDetail(\'' + o.id + '\')">详情</button></div>' +
    '</div>' +
  '</div>';
}

function renderAdminOrders() {
  var container = document.getElementById('admin-content');
  var filter = state.adminOrderFilter;
  var list = filter === 'all' ? state.orders : state.orders.filter(function(o) { return o.status === filter; });
  var names = { all: '全部', pending: '待配送', delivering: '配送中', delivered: '已送达' };

  var html = '<div class="filter-bar">';
  ['all','pending','delivering','delivered'].forEach(function(f) {
    var cnt = f === 'all' ? state.orders.length : state.orders.filter(function(o){return o.status===f;}).length;
    html += '<div class="fb-item ' + (filter === f ? 'active' : '') + '" onclick="filterAdminOrders(\'' + f + '\')">' + names[f] + '(' + cnt + ')</div>';
  });
  html += '</div>';

  if (state.orders.length > 0) {
    html += '<button class="add-product-btn" style="background:#3380ff;margin-bottom:10px;" onclick="exportOrdersCSV()">📋 导出全部订单(CSV)</button>';
  }

  if (list.length === 0) {
    html += '<div class="admin-empty">暂无' + (filter==='all'?'':names[filter]) + '订单</div>';
  } else {
    list.forEach(function(o) { html += adminOrderCardHtml(o); });
  }
  container.innerHTML = html;
}

function exportOrdersCSV() {
  if (state.orders.length === 0) { showToast('暂无订单可导出'); return; }
  var rows = [['订单编号','状态','收货人','手机号','地址','配送时间','商品明细','商品小计','折扣','配送费','新客减免','实付金额','备注','下单时间']];
  var statusMap = { pending: '待配送', delivering: '配送中', delivered: '已送达' };
  state.orders.forEach(function(o) {
    var items = o.items.map(function(i) { return i.name + 'x' + i.qty + i.unit; }).join('; ');
    rows.push([
      o.no, statusMap[o.status] || o.status, o.name, o.phone, o.address, o.slot,
      items, o.subtotal.toFixed(2), o.discountAmount.toFixed(2), o.shippingFee.toFixed(2),
      o.newCustomerDiscount.toFixed(2), o.total.toFixed(2), o.remark || '', o.createTime || ''
    ]);
  });
  var csv = '\ufeff' + rows.map(function(r) { return r.map(function(c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'orders_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('订单已导出');
}

function filterAdminOrders(f) { state.adminOrderFilter = f; renderAdminOrders(); }

function advanceOrderStatus(orderId) {
  var o = state.orders.find(function(x) { return x.id === orderId; });
  if (!o) return;

  else if (o.status === 'delivering') { o.status = 'delivered'; showToast('已确认送达 🎉'); }

  renderAdminOrders();
  renderOrders();
}

function savePromoSettings() {
  var minOrder = parseFloat(document.getElementById('set-minorder').value) || 0;

  var freeShip = parseFloat(document.getElementById('set-freeship').value) || 0;

  if (d80 > 0 && d90 > 0 && d80 <= d90) { showToast('8折门槛需大于9折门槛'); return; }

  state.promo = {
    minOrder: minOrder, shippingFee: shipping, freeShippingThreshold: freeShip,

  state.notice = n;

/* ===== 数据备份与恢复 ===== */
function exportBackup() {
  var backup = {
    version: 2,
    exportDate: new Date().toLocaleString('zh-CN'),
    categories: state.categories,
    products: state.products,
    promo: state.promo,
    notice: state.notice,
    orders: state.orders,
  };
  var json = JSON.stringify(backup, null, 2);
  var blob = new Blob([json], { type: 'application/json;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'veggie_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('备份文件已下载');
}

function importBackup(input) {
  var file = input.files[0];
  if (!file) return;
  if (!confirm('确定导入备份数据吗？这将覆盖当前所有商品、分类、规则和订单。')) {
    input.value = '';
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data || !data.products || !data.categories) {
        showToast('文件格式不正确');
        return;
      }
      if (data.categories && data.categories.length) { state.categories = data.categories; saveCategories(); }
      if (data.products && data.products.length) { state.products = data.products; saveProducts(); }
      if (data.promo) { state.promo = data.promo; savePromo(); }
      if (data.notice) { state.notice = data.notice; saveNotice(); document.getElementById('notice-text').textContent = data.notice; }
      if (data.orders) { state.orders = data.orders; saveOrders(); }
      // 检查首单状态
      if (data.orders && data.orders.length > 0) {
        state.isFirstOrder = false;
        localStorage.setItem('veggie_first_order', '0');
      }
      showToast('数据恢复成功！');
      renderCategories();
      renderProducts();
      updateCartBar();
      renderAdminSettings();
    } catch(err) {
      showToast('文件解析失败：' + err.message);
    }
    input.value = '';
  };
  reader.readAsText(file, 'utf-8');
}

/* ========================================
   初始化
   ======================================== */
function init() {
  // 检查首单状态
  if (localStorage.getItem('veggie_first_order') === '0') {
    state.isFirstOrder = false;
  }
  // 加载首页公告
  document.getElementById('notice-text').textContent = state.notice;
  renderCategories();
  renderProducts();
  updateCartBar();

  // 提交订单按钮
  document.getElementById('submit-order-btn').addEventListener('click', submitOrder);
}

init();
</script>
</body>
</html>
